; Irradiance-field probe density is a renderer startup control, not an Unreal
; scalability CVar. Keep it here so the High preset's supported irradiance-
; volume final gather actually uses the profiled 8x8/50-probe update budget.
; Unreal's occlusion preparation path cannot resample this cache, so its
; resolution must exactly match the radiance probe resolution. Epic's
; ScreenProbeGather path does not consume these controls.
r.Lumen.IrradianceFieldGather.ProbeResolution=8
r.Lumen.IrradianceFieldGather.OcclusionProbeResolution=8
r.Lumen.IrradianceFieldGather.NumProbesToTraceBudget=50

