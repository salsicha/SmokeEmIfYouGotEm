[SystemSettings]
; The stock cloud trace uses up to 96 primary samples and dominated the M5
; full-reach frame. Quarter-resolution temporal reconstruction remains active,
; so eight bounded samples retain a stable weather layer without consuming
; more GPU time than the raft, water, terrain, and foliage combined.
; Cloud sample budget raised from the former 8/1: at that starvation each
; cloud pixel traced a handful of jittered samples per frame and the
; temporal reconstruction visibly boiled ("clouds are jittering",
; 2026-08-28; sky frame-diff 2.42 -> 1.10 at 64/2). Engine default is 768;
; 64 is still a firm perf budget. Revert here if target hardware regresses.
r.VolumetricCloud.SampleMinCount=2
r.VolumetricCloud.ViewRaySampleMaxCount=64
r.VolumetricCloud.ReflectionRaySampleMaxCount=4
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=4
r.VolumetricCloud.Shadow.ReflectionRaySampleMaxCount=2
; Irradiance-field probe density is a renderer startup control, not an Unreal
; scalability CVar. Keep it here so the High preset's supported irradiance-
; volume final gather actually uses the profiled 8x8/50-probe update budget.
; Unreal's occlusion preparation path cannot resample this cache, so its
; resolution must exactly match the radiance probe resolution. Epic's
; ScreenProbeGather path does not consume these controls.
r.Lumen.IrradianceFieldGather.ProbeResolution=8
r.Lumen.IrradianceFieldGather.OcclusionProbeResolution=8
r.Lumen.IrradianceFieldGather.NumProbesToTraceBudget=50

