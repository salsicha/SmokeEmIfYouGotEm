; TSR instead of TAA: static-camera frame-diff measurement (2026-08-27)
; showed the open-water surface itself is temporally stable, so remaining
; perceived flicker happens under camera motion, where TAA re-resolves the
; water's specular detail every frame. TSR's shading-rejection history is
; markedly more stable on moving high-frequency specular. Revert to 2 (TAA)
; if GPU cost regresses on target hardware.
r.DefaultFeature.AntiAliasing=4
r.AntiAliasingMethod=4
; High-resolution TSR history stabilised thin distant geometry (hillside
; tree scatter frame-diff 4.62 -> 3.20, 2026-08-28) but at 200 the history
; buffers hold 4x the output pixels across TSR's whole buffer set. On the
; development machine's 6 GB adapter (measured 2026-09-02) that — stacked
; on Nanite + Lumen + virtual shadow maps, and doubled whenever the editor
; renders beside the game — drove the D3D12 residency manager tens of GB
; over budget ("Video memory has been exhausted ... Expect extremely poor
; performance" within minutes of a run). 100 stays inside budget at
; windowed resolutions; raise it again only on >=12 GB hardware.
r.TSR.History.ScreenPercentage=100
r.GPUSkin.Support16BitBoneIndex=True
r.GPUSkin.UnlimitedBoneInfluences=True

