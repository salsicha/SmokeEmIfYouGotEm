[GlobalIlluminationQuality@0]
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=8

[GlobalIlluminationQuality@2]
; The full-reach Apple M5 GPU profile localized the sustained High-preset
; bottleneck to Lumen ScreenProbeGather. Use Unreal's supported Lumen
; irradiance-volume final gather with a bounded update budget; direct sun, VSM
; shadows, water, detailed terrain, foliage, and Lumen diffuse indirect light
; remain enabled. Epic quality retains ScreenProbeGather.
r.Lumen.FinalGatherMethod=0

[GlobalIlluminationQuality@3]
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32

[ReflectionQuality@2]
; The South Fork river occupies most of the gameplay frame. At High, retain
; coherent skylight/reflection-capture water instead of tracing Lumen through
; every visible water pixel. Opaque-scene Lumen reflections stay enabled: the
; v515 fixed-camera review proved that disabling them collapsed the procedural
; boulder's upper specular response to black. The water refraction buffer stays
; enabled at half resolution. The authored river uses Single Layer Water's
; reflection-capture path and the volumetric foam/spray use the translucency
; lighting volume, so the separate translucent-reflection radiance-cache mark
; is redundant. The matched v269/v270 breaking-water review retained the same
; water, foam, mist, shoreline, and boulder presentation with it disabled.
r.Water.SingleLayer.Reflection=2
r.Water.SingleLayer.RefractionDownsampleFactor=2
r.Lumen.TranslucencyReflections.RadianceCache=0

[ShadowQuality@2]
; VSM sun/contact shadows remain authoritative. Skip the redundant distance-
; field shadow trace inside Single Layer Water; the water still receives the
; project's compiled VSM filtering and direct-light response.
r.Water.SingleLayer.DistanceFieldShadow=0

[FoliageQuality@2]
; The full South Fork source mesh carries canopy colour and shadows in its
; NAIP macro albedo. Keep detailed corridor vegetation at authored density,
; while scalable non-colliding far-field HISMs use a measured half-density
; High preset. On the Apple M5 1080p/60% reference this removes a render/GPU
; bottleneck (20.377 ms -> 14.329 ms p95) without opening the playable banks.
foliage.DensityScale=0.50
grass.DensityScale=0.50

[FoliageQuality@3]
foliage.DensityScale=1.0
grass.DensityScale=1.0
