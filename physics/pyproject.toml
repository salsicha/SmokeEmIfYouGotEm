[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raftsim"
version = "0.1.0"
description = "Headless physics foundation for a white water rafting simulator."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "SmokeEmIfYouGotEm contributors" }
]
dependencies = [
  "numpy>=1.26",
  # PNG/texture generation across raftsim modules; >=12.3 for Image.get_flattened_data
  # (exercised by the test suite). Was previously pulled in only implicitly via the
  # plot extra's matplotlib, which broke fresh checkouts.
  "pillow>=12.3",
]

# Installed by `uv run`/`uv sync` by default so `uv run pytest -q` works on a
# fresh checkout of any platform without relying on a PATH pytest. matplotlib
# keeps the example-plot tests exercised rather than import-erroring.
[dependency-groups]
dev = [
  "pytest>=8",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8"
]
plot = [
  "matplotlib>=3.8"
]
research = [
  "clawpack>=5.10",
]
geospatial = [
  "rasterio>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
